server.port=8082
# Eureka y MySQL se configuran en application.properties compartido.
# Circuit Breaker del resumen de socios
resilience4j.circuitbreaker.instances.resumenCobranzas.slidingWindowSize=10
resilience4j.circuitbreaker.instances.resumenCobranzas.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.resumenCobranzas.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resumenCobranzas.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.resumenPagos.slidingWindowSize=10
resilience4j.circuitbreaker.instances.resumenPagos.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.resumenPagos.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resumenPagos.waitDurationInOpenState=10s
